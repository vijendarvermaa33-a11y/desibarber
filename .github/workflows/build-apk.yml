name: Build Desibarber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Desibarber Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Android ZIP
        run: |
          echo "Repository files:"
          ls -lah

          if [ ! -f "AndroidApp.zip" ]; then
            echo "ERROR: AndroidApp.zip not found!"
            exit 1
          fi

          echo "AndroidApp.zip found successfully."

      - name: Extract Android Project
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -o AndroidApp.zip -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 5 -type f | sort

      - name: Detect Android Project
        id: detect
        shell: bash
        run: |
          SETTINGS_FILE=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find android-project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify Android Project
        run: |
          PROJECT="${{ steps.detect.outputs.project_dir }}"

          echo "Project directory:"
          echo "$PROJECT"

          ls -lah "$PROJECT"

          if [ ! -f "$PROJECT/settings.gradle" ] && \
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle" ] && \
             [ ! -f "$PROJECT/build.gradle.kts" ]; then
            echo "ERROR: Root Gradle build file missing!"
            exit 1
          fi

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: app directory missing!"
            exit 1
          fi

          echo "Android project verification successful."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # IMPORTANT:
      # Do not let setup-android install the obsolete "tools" package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK Packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check Android SDK
        shell: bash
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed packages:"
          sdkmanager --list_installed | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Check App Files
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          echo "MainActivity:"
          find app/src/main/java -type f | sort

          echo ""
          echo "Resources:"
          find app/src/main/res -maxdepth 3 -type f | sort

          echo ""
          echo "Android Manifest:"
          cat app/src/main/AndroidManifest.xml

      - name: Build Desibarber APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        shell: bash
        run: |
          echo "Starting Gradle build..."

          gradle clean

          gradle assembleDebug \
            --stacktrace \
            --info

      - name: Find APK
        id: apk
        shell: bash
        run: |
          echo "Searching for APK..."

          find android-project \
            -type f \
            -name "*.apk" \
            -print

          APK_FILE=$(find android-project \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          echo "apk_file=$APK_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p final-apk

          cp "${{ steps.apk.outputs.apk_file }}" \
            "final-apk/Desibarber.apk"

          ls -lh final-apk/Desibarber.apk

      - name: Upload Desibarber APK
        uses: actions/upload-artifact@v4
        with:
          name: Desibarber-APK
          path: final-apk/Desibarber.apk
          if-no-files-found: error
          retention-days: 30
